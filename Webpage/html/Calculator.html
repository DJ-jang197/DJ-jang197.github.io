<!DOCTYPE html>

<html lang="en">

    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="../css/Calculator_Styles.css">
        <meta name="viewport" content="initial-scale=1, width=device-width">
        <script src="../js/Calculator.js"></script> <!--- Javascript link, CHATGPT helped me to do javascript on a seperate file -->
        <title>Calculator</title>
    </head>

    <body>
        <br>
        <header> <!-- Main-->
            <h1>Calculator</h1>
            <h3>By DJ</h2>
        </header>
        <br>
        <br> <!-- discovered line break by searching up line break on internet -->
        <table>
            <tr>
                <td class="box" id="equation"></td>
            </tr>
            <tr>
                <td class="box" id="answer">Enter an equation</td>
            </tr>
        </table>
        <table>
            <tr> <!-- first row-->
                <td><button class="number" value="7">7</button></td>
                <td><button class="number" value="8">8</button></td>
                <td><button class="number" value="9">9</button></td>
                <td><button class="extra" value="+">+</button></td>
                <td><button class="enter">=</button></td>
            </tr>
            <tr> <!-- second row-->
                <td><button class="number" value="4">4</button></td>
                <td><button class="number" value="5">5</button></td>
                <td><button class="number" value="6">6</button></td>
                <td><button class="extra" value="-">-</button></td>
            </tr>
            <tr> <!-- third row-->
                <td><button class="number" value="1">1</button></td>
                <td><button class="number" value="2">2</button></td>
                <td><button class="number" value="3">3</button></td>
                <td><button class="extra" value="*">×</button></td>
            </tr>
            <tr> <!-- fourth row...with bonus-->
                <td><button id="ok" class="extra">👌</button></td>
                <td><button class="number" value="0">0</button></td>
                <td><button id="del" class="extra">⌫</button></td>
                <td><button class="extra" value="/">÷</button></td>
            </tr>
        </table>
        <h6 id="bonus"></h6> <!-- secret "slot"-->
    </body>

</html>
